<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marginalia</title>
  <meta name="description" content="Ask a research question. Marginalia searches the literature, reads the papers, writes a cited review, checks every citation, and lets you argue with it out loud.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318233A'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' fill='none' stroke='%23F1D34B' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="shell" id="shell">
    <header class="topbar">
      <button class="icon-btn library-toggle" id="libraryToggle" aria-label="Show library" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <a class="brand" href="#/" aria-label="Marginalia home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M9 22V10l7 8 7-8v12"/></svg>
        <span>Marginalia</span>
      </a>
      <nav class="tabs" id="tabs" aria-label="Session views" hidden></nav>
      <div class="topbar-end">
        <span class="engine-pill" id="enginePill" hidden></span>
        <button class="debate-btn" id="debateBtn" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
          <span>Debate</span>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <aside class="library" id="library" aria-label="Library">
      <a class="new-btn" href="#/">New question</a>
      <div class="library-list" id="libraryList"></div>
      <button class="setup-link" id="setupLink">Setup and status</button>
    </aside>

    <main class="stage" id="stage" tabindex="-1"></main>

    <aside class="debate" id="debate" aria-label="Voice debate" hidden></aside>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="selection-pop" id="selectionPop" hidden>
    <button data-act="verify">Check against sources</button>
    <button data-act="debate">Raise in debate</button>
    <button data-act="note">Pin as note</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
